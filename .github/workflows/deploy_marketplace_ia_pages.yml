name: Deploy Marketplace IA Public Landing

on:
  push:
    branches:
      - main
    paths:
      - "public_pages/marketplace_ia/**"
      - ".github/workflows/deploy_marketplace_ia_pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marketplace-ia-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_pages/marketplace_ia

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4