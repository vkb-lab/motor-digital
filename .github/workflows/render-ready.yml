name: Render Ready Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Compile Render entrypoint
        run: python -m py_compile app.py

      - name: Validate Render blueprint
        shell: python
        run: |
          from pathlib import Path

          text = Path("render.yaml").read_text(encoding="utf-8-sig")
          required = [
              "type: web",
              "runtime: python",
              "autoDeploy: true",
              "streamlit run",
              "KOS_RUNTIME",
              "KOS_EXTERNAL_PUBLISH_ENABLED",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Missing render.yaml markers: {missing}")
