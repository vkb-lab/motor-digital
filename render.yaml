services:
  - type: web
    name: kos-cloud-status
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: streamlit run app_render.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: KOS_RUNTIME
        value: render
      - key: KOS_EXTERNAL_PUBLISH_ENABLED
        value: false
      - key: KOS_LIVE_CONNECTORS_ENABLED
        value: false
      - key: KOS_BROWSER_OPERATOR_ENABLED
        value: false

  - type: static
    name: k-atlas-assets
    buildCommand: echo "K-Atlas static assets ready"
    staticPublishPath: public
    autoDeploy: false
